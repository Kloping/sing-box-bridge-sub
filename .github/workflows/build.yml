name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: --win --x64
            artifact_path: release/*.exe
          - name: Windows arm64
            os: windows-latest
            args: --win --arm64
            artifact_path: release/*.exe
#          - name: macOS x64
#            os: macos-13
#            args: --mac --x64
          - name: macOS arm64
            os: macos-14
            args: --mac --arm64
            artifact_path: release/*.dmg
          - name: macOS universal
            os: macos-14
            args: --mac --universal
            artifact_path: release/*.dmg
          - name: Linux x64
            os: ubuntu-22.04
            args: --linux --x64
            artifact_path: release/*.AppImage
          - name: Linux arm64
            os: ubuntu-22.04
            args: --linux --arm64
            artifact_path: release/*.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Node and lockfile
        run: node -e "const lock=require('./package-lock.json'); const missing=Object.entries(lock.packages||{}).filter(([name,p])=>p && !p.version); if(missing.length){console.error('Lockfile entries missing version:', missing.map(([name])=>name).join(', ')); process.exit(1)} console.log('Node',process.version,'lockfile',lock.lockfileVersion);"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run dist -- --publish never ${{ matrix.args }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-bridge-sub-${{ matrix.name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sing-box-bridge-sub-*
          path: release
          merge-multiple: false

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p publish
          find release -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -print0 |
            while IFS= read -r -d '' file; do
              artifact=$(basename "$(dirname "$file")")
              case "$artifact" in
                *Windows\ x64*) platform=win-x64 ;;
                *Windows\ arm64*) platform=win-arm64 ;;
                *macOS\ arm64*) platform=mac-arm64 ;;
                *macOS\ universal*) platform=mac-universal ;;
                *Linux\ x64*) platform=linux-x64 ;;
                *Linux\ arm64*) platform=linux-arm64 ;;
                *) echo "Unknown artifact: $artifact" >&2; exit 1 ;;
              esac
              extension="${file##*.}"
              cp "$file" "publish/sing-box-bridge-sub-${platform}.${extension}"
            done
          test -n "$(find publish -type f -print -quit)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            publish/*.exe
            publish/*.dmg
            publish/*.AppImage
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
